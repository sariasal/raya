<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="y las líneas que hemos encontrado apestan a europa demasiado fuerte">
  <title>mi papá y yo creemos que es importante ubicarse</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./script.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div>
      <p class="eyebrow"></p>
      <h1>mi papá y yo creemos que es importante ubicarse</h1>
      <p class="subtitle">y las líneas que hemos encontrado apestan a europa demasiado fuerte</p>
    </div>
    <a class="repo-link" href="https://github.com/" target="_blank" rel="noreferrer">GitHub ↗</a>
  </header>

  <main>
    <section class="panel controls-panel" aria-labelledby="explore-title">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Ráscale</p>
        </div>
        <p id="load-status" class="status" role="status">Cargando acontecimientos…</p>
      </div>

      <div class="control-grid">
        <label class="field search-field">
          <span>Buscar</span>
          <input id="search" type="search" placeholder="Título, descripción o región">
        </label>
        <label class="field">
          <span>Categoría</span>
          <select id="category-filter">
            <option value="">Todas las categorías</option>
          </select>
        </label>
        <label class="field">
          <span>Región</span>
          <select id="region-filter">
            <option value="">Todas las regiones</option>
          </select>
        </label>
      </div>

      <div class="range-controls">
        <label class="field">
          <span>Desde (año)</span>
          <input id="range-start" type="number" value="-10000" step="1">
        </label>
        <label class="field">
          <span>Hasta (año)</span>
          <input id="range-end" type="number" value="2026" step="1">
        </label>
        <button id="apply-range" class="button button-primary">Ir al intervalo</button>
      </div>

      <div class="zoom-controls" aria-label="Controles de navegación temporal">
        <button id="zoom-out" class="button" type="button" title="Alejar la vista">− Alejar</button>
        <button id="zoom-in" class="button" type="button" title="Acercar la vista">＋ Acercar</button>
        <button id="pan-left" class="button" type="button" title="Moverse hacia el pasado">← Pasado</button>
        <button id="pan-right" class="button" type="button" title="Moverse hacia el futuro">Futuro →</button>
        <button id="reset-view" class="button button-quiet" type="button">Vista completa</button>
      </div>
    </section>

    <section class="panel timeline-panel" aria-labelledby="timeline-title">
      <div class="section-heading timeline-heading">
        </div>
        <p id="visible-range" class="range-label">—</p>
      </div>
      <div id="timeline-viewport" class="timeline-viewport" tabindex="0" aria-label="Línea del tiempo desplazable">
        <div id="timeline-track" class="timeline-track">
          <div class="axis-line"></div>
          <div id="ticks" class="ticks"></div>
          <div id="markers" class="markers"></div>
        </div>
      </div>
      <div class="timeline-footer">
        <p id="event-count">0 acontecimientos</p>
        <p>Las fechas anteriores a nuestra era se escriben con signo negativo.</p>
      </div>
    </section>

    <section class="panel details-panel" aria-labelledby="details-title">
      <div class="section-heading">
        <div>
          <p class="eyebrow">NOTAS</p>
          <h2 id="details-title">pícale a un evento</h2>
        </div>
      </div>
      <div id="event-details" class="event-details">
      </div>
    </section>
  </main>

</body>
</html>
